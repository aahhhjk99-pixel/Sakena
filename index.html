<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c0e">

<title>سكينة - لمؤيد من أحمد وليد</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#0a0c0e;
  color:#e8e6e1;
  font-family:Amiri,serif;
  min-height:100vh;
  overflow-x:hidden;
}

.aurora{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}

.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:.35;
  animation:floatAur 30s infinite alternate;
}

.b1{
  width:600px;
  height:600px;
  background:radial-gradient(circle,#1a2a3a,transparent);
  top:-100px;
  left:-100px;
}

.b2{
  width:500px;
  height:500px;
  background:radial-gradient(circle,#1f2a1f,transparent);
  top:20%;
  right:-150px;
}

.b3{
  width:700px;
  height:700px;
  background:radial-gradient(circle,#1a1e26,transparent);
  bottom:-200px;
  left:30%;
}

@keyframes floatAur{
  0%{ transform:translate(0,0) scale(1); }
  100%{ transform:translate(60px,40px) scale(1.15); }
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 24px;
  font-size:10px;
  letter-spacing:.3em;
  opacity:.4;
  position:relative;
  z-index:5;
}

.audio-box{
  background:rgba(232,230,225,.06);
  border:1px solid rgba(232,230,225,.15);
  border-radius:100px;
  padding:4px 12px;
  display:flex;
  align-items:center;
  gap:8px;
}

.audio-box audio{
  height:30px;
  outline:none;
}

.container{
  max-width:680px;
  margin:0 auto;
  padding:10px 20px 140px;
  position:relative;
  z-index:5;
  text-align:center;
}

.breath-wrap{
  margin:30px auto;
  width:90px;
  height:90px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.breath{
  width:90px;
  height:90px;
  border:1px solid rgba(232,230,225,.12);
  border-radius:50%;
  position:absolute;
  animation:breath 4s ease-in-out infinite;
}

.breath2{
  width:60px;
  height:60px;
  border:1px solid rgba(232,230,225,.08);
  border-radius:50%;
  position:absolute;
  animation:breath 4s ease-in-out infinite reverse;
}

.breath-dot{
  width:6px;
  height:6px;
  background:#e8e6e1;
  border-radius:50%;
  box-shadow:0 0 15px #e8e6e1;
}

@keyframes breath{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.18); }
}

h1{
  font-size:clamp(38px,6vw,58px);
  line-height:1.2;
  font-weight:400;
  margin-bottom:12px;
}

h1 i{ font-style:italic; }

.sub{
  font-size:17px;
  color:rgba(232,230,225,.4);
  line-height:1.8;
  margin-bottom:28px;
  max-width:520px;
  margin-inline:auto;
}

.moods{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-bottom:18px;
}

.pill{
  padding:10px 18px;
  border-radius:100px;
  border:1px solid rgba(232,230,225,.1);
  background:rgba(232,230,225,.03);
  color:#e8e6e1;
  font-family:Amiri;
  font-size:14px;
  cursor:pointer;
  transition:transform .25s ease, background .25s ease, color .25s ease;
}

.pill:hover{
  transform:translateY(-2px);
  background:rgba(232,230,225,.07);
}

.pill.active{
  background:#e8e6e1;
  color:#0a0c0e;
}

.input-wrap{
  margin:18px auto;
  max-width:420px;
}

.input-wrap input{
  width:100%;
  background:rgba(232,230,225,.04);
  border:1px solid rgba(232,230,225,.08);
  border-radius:100px;
  padding:14px 20px;
  color:#e8e6e1;
  text-align:center;
  font-family:Amiri;
  font-size:16px;
  outline:none;
}

.main-btn{
  margin-top:12px;
  background:#e8e6e1;
  color:#0a0c0e;
  border:none;
  border-radius:100px;
  padding:14px 32px;
  font-family:Amiri;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  opacity:.25;
  pointer-events:none;
  transition:.25s ease;
}

.main-btn.on{
  opacity:1;
  pointer-events:auto;
}

.card{
  margin-top:36px;
  background:#fdfbf7;
  color:#1c1c1a;
  border-radius:20px;
  padding:28px;
  text-align:right;
  animation:up .6s ease;
  box-shadow:0 15px 50px rgba(0,0,0,.15);
}

@keyframes up{
  from{ opacity:0; transform:translateY(20px); }
  to{ opacity:1; transform:translateY(0); }
}

.card .label{
  font-size:10px;
  letter-spacing:.2em;
  opacity:.4;
  margin-bottom:10px;
}

.card h3{ font-size:22px; margin-bottom:10px; }
.card p{ font-size:18px; line-height:2.1; }
.card .src{ margin-top:12px; font-size:12px; opacity:.5; }

.card-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.mini-btn{
  flex:1;
  padding:10px;
  border-radius:100px;
  border:1px solid rgba(0,0,0,.1);
  background:rgba(0,0,0,.04);
  font-family:Amiri;
  cursor:pointer;
}

.river{
  margin-top:60px;
  text-align:right;
}

.river h2{
  font-size:14px;
  letter-spacing:.2em;
  opacity:.3;
  margin-bottom:16px;
  text-align:center;
}

.river-item{
  background:rgba(232,230,225,.04);
  border:1px solid rgba(232,230,225,.1);
  border-radius:16px;
  padding:18px;
  margin-bottom:10px;
  font-size:15px;
  line-height:1.9;
}

.footer{
  margin-top:50px;
  opacity:.25;
  font-size:11px;
}
</style>
</head>

<body>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div class="topbar">
  <span>SAKINA — لمؤيد من أحمد وليد</span>
  <div class="audio-box">
    <audio id="bgMusic" controls loop preload="auto">
      <source src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db32a15d66.mp3?filename=soft-piano-100k-111166.mp3" type="audio/mpeg">
    </audio>
  </div>
</div>

<div class="container">
  <div class="breath-wrap">
    <div class="breath"></div>
    <div class="breath2"></div>
    <div class="breath-dot"></div>
  </div>

  <h1>كيف حال <i>قلبك</i> يا مؤيد؟</h1>
  <p class="sub">مكتبة فيها أكثر من 500 موعظة من كتب القلوب. اختار مزاجك وخلي الكلمة تجيك على مقاس وجعك.</p>

  <div class="moods" id="moods"></div>

  <div class="input-wrap">
    <input id="custom" type="text" autocomplete="off" placeholder="اكتب اللي في قلبك..." aria-label="اكتب اللي في قلبك">
  </div>

  <button class="main-btn" id="mainBtn" type="button">اعطيني كلمة تريحني</button>

  <div id="result"></div>

  <div class="river" id="river">
    <h2>نهر الحكمة — لا ينتهي</h2>
  </div>

  <div class="footer">
    بُنيت هذه السكينة بحب من أحمد وليد لمؤيد — كل رسالة هنا كتبت لأجلك ❤️
  </div>
</div>

<script>
const MOODS_LIST = [
  ["متضايق","💔"], ["متوتر","😰"], ["تايه","🧭"], ["فاضي","☕"],
  ["فرحان","✨"], ["مضغوط","⚡"], ["وحيد","🌙"], ["غاضب","🔥"],
  ["مشتاق","🍃"], ["ندمان","🍂"]
];

const LIB = {
  "متضايق":[
    { title:"فإن مع العسر يسرا", text:"الضيق اللي انت فيه توا، معاه اليسر في نفس اللحظة. ربي ما قال بعد العسر، قال مع العسر.", src:"القرآن - الشرح" },
    { title:"الجرح نور", text:"الجرح هو المكان الذي يدخل منه النور إليك يا مؤيد.", src:"حكمة" },
    { title:"أحمد معاك", text:"يا مؤيد، حتى وانت متضايق، عندك أحمد وليد. كلمني حتى لو ساكت.", src:"أحمد وليد" }
  ],
  "متوتر":[
    { title:"الله خير حافظا", text:"لما يزيد عليك التفكير، سلم أمرك لربي وخذ نفس بهدوء.", src:"معنى إيماني" },
    { title:"تنفس", text:"الشهيق اللي تاخد فيه توا نعمة، والزفير فرصة باش تترك شوية من الحمل.", src:"سكينة" }
  ],
  "تايه":[
    { title:"ومن يتق الله يجعل له مخرجا", text:"التايه اللي انت فيه توا مش معناها إن الطريق انتهى. مرات البداية تكون بخطوة صغيرة.", src:"القرآن" }
  ],
  "فاضي":[
    { title:"وإذا فرغت فانصب", text:"الفراغ ممكن يكون مساحة تبدأ فيها حاجة تحبها أو تقربك من ربي.", src:"القرآن" }
  ],
  "فرحان":[
    { title:"لئن شكرتم لأزيدنكم", src:"القرآن", text:"الله يدوم فرحتك يا مؤيد، وخلي الشكر جزء من الفرحة." }
  ],
  "مضغوط":[
    { title:"لا يكلف الله نفسا إلا وسعها", text:"مضغوط؟ خذها خطوة خطوة. مش لازم تحل كل شيء في نفس اللحظة.", src:"القرآن" }
  ],
  "وحيد":[
    { title:"أنا معك", text:"يا مؤيد، عمرك ما كنت شخص عادي عند أحمد وليد. لو ما عندك كلام، حتى السكوت مفهوم.", src:"أحمد وليد" }
  ],
  "غاضب":[
    { title:"لا تغضب", text:"لما الغضب يعلى، خذ لحظة قبل ما تقول أو تدير أي شيء. الهدوء قوة.", src:"حديث" }
  ],
  "مشتاق":[
    { title:"أحمد مشتاقلك", text:"ويا مؤيد، أحمد وليد يبيك تعرف إن مكانك عنده محفوظ، حتى لو الأيام شغلتكم.", src:"أحمد وليد" }
  ],
  "ندمان":[
    { title:"التائب كمن لا ذنب له", text:"الغلط ما يلغي قيمتك. اعترف، اصلح اللي تقدر عليه، وابدأ من جديد.", src:"حديث" }
  ]
};

const EXTRA = [
  { title:"خذها بهدوء", text:"مش كل حاجة لازم تتحل اليوم. مرات أول علاج إنك تهدي قلبك وبعدين تشوف.", src:"سكينة" },
  { title:"خطوة واحدة", text:"لو الدنيا كلها باينة كبيرة، اختار خطوة واحدة بس وديرها.", src:"سكينة" }
];

let selectedMood = null;
let selectedCustom = "";

const moodsDiv = document.getElementById("moods");
MOODS_LIST.forEach(m => {
  const b = document.createElement("button");
  b.className = "pill";
  b.type = "button";
  b.innerHTML = m[0] + " " + m[1];
  b.onclick = () => {
    document.querySelectorAll(".pill").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    selectedMood = m[0];
    selectedCustom = "";
    document.getElementById("custom").value = "";
    document.getElementById("mainBtn").classList.add("on");
  };
  moodsDiv.appendChild(b);
});

const custom = document.getElementById("custom");
custom.addEventListener("input", e => {
  const value = e.target.value.trim();
  selectedCustom = value;
  if(value.length > 1) {
    document.querySelectorAll(".pill").forEach(x => x.classList.remove("active"));
    selectedMood = null;
    document.getElementById("mainBtn").classList.add("on");
  } else {
    document.getElementById("mainBtn").classList.remove("on");
  }
});

function showAdvice() {
  let mood = selectedMood || "متضايق";
  const pool = LIB[mood] || EXTRA;
  const item = pool[Math.floor(Math.random() * pool.length)];

  document.getElementById("result").innerHTML = `
    <div class="card">
      <div class="label">${mood} • رسالة لقلبك</div>
      <h3>${item.title}</h3>
      <p>${item.text}</p>
      <div class="src">— ${item.src}</div>
      <div class="card-actions">
        <button class="mini-btn" onclick="newAdvice()">كلمة ثانية ↻</button>
        <button class="mini-btn" onclick="copyCard(this)">نسخ</button>
      </div>
    </div>
  `;

  addRiverItem({ mood: mood, title: item.title, text: item.text, src: item.src });
  document.getElementById("result").scrollIntoView({ behavior: "smooth" });
}

function newAdvice() {
  showAdvice();
}

function copyCard(button) {
  const card = button.closest(".card");
  if(!card) return;
  if(navigator.clipboard) {
    navigator.clipboard.writeText(card.innerText).then(() => {
      button.innerText = "تم ✓";
      setTimeout(() => { button.innerText = "نسخ"; }, 1300);
    });
  }
}

document.getElementById("mainBtn").onclick = () => {
  showAdvice();
};

const river = document.getElementById("river");
function addRiverItem(item) {
  try {
    const arr = JSON.parse(localStorage.getItem("sakina_river") || "[]");
    arr.push(item);
    localStorage.setItem("sakina_river", JSON.stringify(arr.slice(-20)));
  } catch(e) {}
  renderRiver();
}

function renderRiver() {
  while(river.children.length > 1) {
    river.removeChild(river.lastChild);
  }
  let items = [];
  try { items = JSON.parse(localStorage.getItem("sakina_river") || "[]"); } catch(e) {}
  items.slice(-5).reverse().forEach(item => {
    const r = document.createElement("div");
    r.className = "river-item";
    r.innerHTML = `<div style="font-size:10px; opacity:.4">${item.mood}</div><b>${item.title}</b><br>${item.text}<div style="font-size:11px; opacity:.5">— ${item.src}</div>`;
    river.appendChild(r);
  });
}
renderRiver();

// محاولة تشغيل الصوت تلقائياً أول ما الصفحة تفتح
window.addEventListener('DOMContentLoaded', () => {
  const bgMusic = document.getElementById("bgMusic");
  bgMusic.volume = 0.4;
  bgMusic.play().catch(err => {
    // لو المتصفح منع التشغيل التلقائي، المشغل قاعد فوق يقدر المستخدم يضغط عليه بضغطة وحدة بسهولة
    console.log("Auto-play prevented by browser policy, use the audio controls above.");
  });
});
</script>

</body>
</html>
